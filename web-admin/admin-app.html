<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý app - HoangShoes Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div id="admin-header"></div>

<div class="container my-5 flex-grow-1">
    <h1 class="mb-4">Quản lý app</h1>
    <div class="card shadow-sm mb-4">
        <div class="card-header bg-primary text-white">
            <strong>Quản lý banner trang chủ app</strong>
        </div>

        <div class="card-body">
            <input type="hidden" id="banner-id">

            <div class="row g-3">
                <div class="col-md-5">
                    <label class="form-label">Ảnh banner</label>
                    <input
                        type="file"
                        id="banner-image-file"
                        class="form-control"
                        accept="image/*"
                    >
                    <div class="mt-3">
                        <img
                            id="banner-preview"
                            src=""
                            style="
                                width: 100%;
                                max-height: 220px;
                                object-fit: cover;
                                border-radius: 12px;
                                display: none;
                            "
                        >
                    </div>
                </div>

                <div class="col-md-3">
                    <label class="form-label">Tiêu đề</label>
                    <input type="text" id="banner-title" class="form-control" placeholder="VD: Sale tháng này">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Thứ tự</label>
                    <input type="number" id="banner-order" class="form-control" value="0">
                </div>

                <div class="col-md-2">
                    <label class="form-label">Hiển thị</label>
                    <select id="banner-active" class="form-select">
                        <option value="true">Bật</option>
                        <option value="false">Tắt</option>
                    </select>
                </div>
            </div>

            <div class="mt-3">
                <button class="btn btn-success" onclick="saveBanner()">Lưu banner</button>
                <button class="btn btn-secondary" onclick="resetBannerForm()">Làm mới form</button>
                <button class="btn btn-primary" onclick="loadBanners()">Tải lại banner</button>
            </div>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm mb-5">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Ảnh</th>
                    <th>Tiêu đề</th>
                    <th>Thứ tự</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody id="banners-body">
                <tr>
                    <td colspan="7" class="text-center">Đang tải banner...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="card shadow-sm mb-4">
        <div class="card-header bg-danger text-white">
            <strong>Gửi thông báo khuyến mãi</strong>
        </div>

        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">Tiêu đề</label>
                    <input
                        type="text"
                        id="promotion-title"
                        class="form-control"
                        placeholder="VD: Siêu sale cuối tuần"
                    >
                </div>

                <div class="col-md-4">
                    <label class="form-label">Gửi đến</label>
                    <select id="promotion-target" class="form-select">
                        <option value="all">Tất cả người dùng</option>
                        <option value="one">Một người dùng</option>
                    </select>
                </div>

                <div class="col-md-4">
                    <label class="form-label">Firebase UID</label>
                    <input
                        type="text"
                        id="promotion-firebase-uid"
                        class="form-control"
                        placeholder="Chỉ nhập nếu gửi 1 người"
                    >
                </div>

                <div class="col-md-12">
                    <label class="form-label">Nội dung thông báo</label>
                    <textarea
                        id="promotion-message"
                        class="form-control"
                        rows="3"
                        placeholder="Nhập nội dung khuyến mãi..."
                    ></textarea>
                </div>
            </div>

            <button
                class="btn btn-danger mt-3"
                onclick="sendPromotionNotification()"
            >
                Gửi thông báo
            </button>
        </div>
    </div>


    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-1">Đánh giá sản phẩm</h4>
                <p class="text-muted mb-0">Quản lý đánh giá sản phẩm từ người dùng Android app.</p>
            </div>

            <button class="btn btn-primary" onclick="loadReviews()">
                Làm mới
            </button>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Sản phẩm</th>
                    <th>Người đánh giá</th>
                    <th>Số sao</th>
                    <th>Nội dung</th>
                    <th>Ngày tạo</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody id="reviews-body">
                <tr>
                    <td colspan="7" class="text-center">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="admin-footer"></div>

<script>
    document
    .getElementById("banner-image-file")
    .addEventListener("change", function(event) {

        const file = event.target.files[0];

        if (!file) return;

        const preview = document.getElementById("banner-preview");

        preview.src = URL.createObjectURL(file);

        preview.style.display = "block";
    });
    const API_BASE = "http://127.0.0.1:8000";
    const API_NOTIFICATIONS = `${API_BASE}/notifications/admin`;
    const API_BANNERS_ADMIN = `${API_BASE}/app-banners/admin`;
    const API_BANNERS = `${API_BASE}/app-banners/`;

    async function sendPromotionNotification() {
        const title = document.getElementById("promotion-title").value.trim();
        const message = document.getElementById("promotion-message").value.trim();
        const target = document.getElementById("promotion-target").value;
        const firebaseUid = document.getElementById("promotion-firebase-uid").value.trim();

        if (!title) {
            alert("Vui lòng nhập tiêu đề thông báo");
            return;
        }

        if (!message) {
            alert("Vui lòng nhập nội dung thông báo");
            return;
        }

        if (target === "one" && !firebaseUid) {
            alert("Vui lòng nhập Firebase UID người nhận");
            return;
        }

        const payload = {
            firebase_uid: target === "all" ? null : firebaseUid,
            title: title,
            message: message,
            type: "promotion",
            related_order_id: null
        };

        try {
            const response = await fetch(API_NOTIFICATIONS, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.text();
                alert("Gửi thông báo thất bại: " + err);
                return;
            }

            alert("Đã gửi thông báo khuyến mãi");

            document.getElementById("promotion-title").value = "";
            document.getElementById("promotion-message").value = "";
            document.getElementById("promotion-firebase-uid").value = "";
            document.getElementById("promotion-target").value = "all";

        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối server");
        }
    }

    function escapeHtml(text) {
        return String(text || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(dateString) {
        if (!dateString) return "N/A";
        const d = new Date(dateString);
        return d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN");
    }

    function renderStars(rating) {
        const starCount = Number(rating || 0);
        return "★".repeat(starCount) + "☆".repeat(5 - starCount);
    }

    async function loadReviews() {
        const tbody = document.getElementById("reviews-body");

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center">Đang tải dữ liệu...</td>
            </tr>
        `;

        try {
            const response = await fetch(`${API_BASE}/products/reviews/admin/all`);

            if (!response.ok) {
                throw new Error("Không tải được danh sách đánh giá");
            }

            const reviews = await response.json();

            if (!Array.isArray(reviews) || reviews.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            Chưa có đánh giá nào.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = "";

            reviews.forEach(review => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${review.id}</td>

                        <td>
                            <div class="fw-bold text-primary">
                                ${escapeHtml(review.product_name || "Không rõ sản phẩm")}
                            </div>
                            <small class="text-muted">Product ID: ${review.product_id}</small>
                        </td>

                        <td>
                            <div class="fw-bold">
                                ${escapeHtml(review.user_name || "Người dùng")}
                            </div>
                            <small class="text-muted">${escapeHtml(review.firebase_uid || "")}</small>
                        </td>

                        <td class="text-warning fw-bold">
                            ${renderStars(review.rating)}
                        </td>

                        <td style="max-width: 360px;">
                            <div class="mb-2">
                                ${escapeHtml(review.comment || "Không có nội dung")}
                            </div>

                            ${
                                review.admin_reply
                                ? `
                                    <div class="alert alert-info py-2 px-3 mb-2">
                                        <strong>Phản hồi HoangShoe:</strong><br>
                                        ${escapeHtml(review.admin_reply)}
                                    </div>
                                `
                                : `
                                    <div class="text-muted small mb-2">
                                        Chưa có phản hồi từ admin
                                    </div>
                                `
                            }

                            <textarea
                                id="reply-${review.id}"
                                class="form-control form-control-sm mb-2"
                                rows="2"
                                placeholder="Nhập phản hồi admin..."
                            >${escapeHtml(review.admin_reply || "")}</textarea>

                            <button
                                class="btn btn-sm btn-primary"
                                onclick="replyReview(${review.id})"
                            >
                                Gửi phản hồi
                            </button>
                        </td>

                        <td>
                            <div>${formatDate(review.created_at)}</div>

                            ${
                                review.is_hidden
                                ? `<span class="badge bg-danger mt-1">Đã ẩn</span>`
                                : `<span class="badge bg-success mt-1">Đang hiển thị</span>`
                            }
                        </td>

                        <td>
                            ${
                                review.is_hidden
                                ? `
                                    <button
                                        class="btn btn-sm btn-success"
                                        onclick="showReview(${review.id})"
                                    >
                                        Hiện
                                    </button>
                                `
                                : `
                                    <button
                                        class="btn btn-sm btn-warning"
                                        onclick="hideReview(${review.id})"
                                    >
                                        Ẩn
                                    </button>
                                `
                            }
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-danger text-center">
                        Lỗi kết nối Server!
                    </td>
                </tr>
            `;
        }
    }

    async function hideReview(id) {

        if (!confirm("Ẩn đánh giá này?")) return;

        try {

            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/hide`,
                {
                    method: "PATCH"
                }
            );

            if (!response.ok) {
                alert("Ẩn đánh giá thất bại!");
                return;
            }

            alert("Đã ẩn đánh giá");

            loadReviews();

        } catch (error) {

            console.error(error);

            alert("Lỗi kết nối server");
        }
    }

    async function showReview(id) {

        if (!confirm("Hiện lại đánh giá này?")) return;

        try {

            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/show`,
                {
                    method: "PATCH"
                }
            );

            if (!response.ok) {
                alert("Hiện đánh giá thất bại!");
                return;
            }

            alert("Đã hiện lại đánh giá");

            loadReviews();

        } catch (error) {

            console.error(error);

            alert("Lỗi kết nối server");
        }
    }

    async function loadBanners() {
        const tbody = document.getElementById("banners-body");

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center">Đang tải banner...</td>
            </tr>
        `;

        try {
            const response = await fetch(API_BANNERS_ADMIN);

            if (!response.ok) {
                throw new Error("Không tải được banner");
            }

            const banners = await response.json();

            if (!Array.isArray(banners) || banners.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            Chưa có banner nào.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = "";

            banners.forEach(banner => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${banner.id}</td>

                        <td class="text-center">
                            <img
                                src="${escapeHtml(banner.image_url)}"
                                alt="Banner"
                                style="width:160px;height:70px;object-fit:cover;border-radius:8px;"
                                onerror="this.src='https://via.placeholder.com/160x70?text=No+Image'"
                            >
                        </td>


                        <td>${escapeHtml(banner.title || "")}</td>

                        <td>${banner.display_order}</td>

                        <td>
                            ${
                                banner.is_active
                                    ? '<span class="badge bg-success">Đang bật</span>'
                                    : '<span class="badge bg-secondary">Đang tắt</span>'
                            }
                        </td>

                        <td>
                            <button class="btn btn-sm btn-warning me-1" onclick='editBanner(${JSON.stringify(banner)})'>
                                Sửa
                            </button>

                            <button class="btn btn-sm btn-danger" onclick="deleteBanner(${banner.id})">
                                Xóa
                            </button>
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);

            tbody.innerHTML = `
                <tr>
                    <td colspan="6" class="text-danger text-center">
                        Lỗi tải banner. Kiểm tra backend API /app-banners.
                    </td>
                </tr>
            `;
        }
    }

    function resetBannerForm() {
        document.getElementById("banner-id").value = "";
        document.getElementById("banner-image-file").value = "";
        document.getElementById("banner-title").value = "";
        document.getElementById("banner-order").value = 0;
        document.getElementById("banner-active").value = "true";

        const preview = document.getElementById("banner-preview");
        preview.src = "";
        preview.dataset.oldUrl = "";
        preview.style.display = "none";
    }

    function editBanner(banner) {
        document.getElementById("banner-id").value = banner.id;
        document.getElementById("banner-title").value = banner.title || "";
        document.getElementById("banner-order").value = banner.display_order || 0;
        document.getElementById("banner-active").value = banner.is_active ? "true" : "false";

        const preview = document.getElementById("banner-preview");
        preview.src = banner.image_url || "";
        preview.dataset.oldUrl = banner.image_url || "";
        preview.style.display = banner.image_url ? "block" : "none";

        window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function saveBanner() {
        const id = document.getElementById("banner-id").value;
        const fileInput = document.getElementById("banner-image-file");
        const file = fileInput.files[0];

        const title = document.getElementById("banner-title").value.trim();
        const displayOrder = Number(document.getElementById("banner-order").value || 0);
        const isActive = document.getElementById("banner-active").value === "true";

        const preview = document.getElementById("banner-preview");

        let imageUrl = "";

        try {
            if (file) {
                if (!window.storage || !window.firebaseRef || !window.uploadBytes || !window.getDownloadURL) {
                    alert("Firebase Storage chưa được cấu hình đúng");
                    return;
                }

                const fileName = `banners/${Date.now()}_${file.name}`;
                const storageRef = window.firebaseRef(window.storage, fileName);

                await window.uploadBytes(storageRef, file);
                imageUrl = await window.getDownloadURL(storageRef);
            } else if (id) {
                imageUrl = preview.dataset.oldUrl || preview.src;
            }

            if (!imageUrl) {
                alert("Vui lòng chọn ảnh banner");
                return;
            }

            const payload = {
                image_url: imageUrl,
                title: title,
                is_active: isActive,
                display_order: displayOrder
            };

            const url = id ? `${API_BANNERS}${id}` : API_BANNERS;
            const method = id ? "PUT" : "POST";

            const response = await fetch(url, {
                method: method,
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const err = await response.text();
                alert("Lưu banner thất bại: " + err);
                return;
            }

            alert(id ? "Đã cập nhật banner" : "Đã thêm banner");
            resetBannerForm();
            loadBanners();

        } catch (error) {
            console.error(error);
            alert("Lỗi lưu banner: " + error.message);
        }
    }

    async function deleteBanner(id) {
        if (!confirm("Bạn chắc chắn muốn xóa banner này?")) return;

        try {
            const response = await fetch(`${API_BANNERS}${id}`, {
                method: "DELETE"
            });

            if (!response.ok) {
                alert("Xóa banner thất bại");
                return;
            }

            alert("Đã xóa banner");
            loadBanners();

        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối server");
        }
    }

    window.onload = () => {
        loadBanners();
        loadReviews();
    };

    async function replyReview(id) {
        const textarea = document.getElementById(`reply-${id}`);
        const reply = textarea.value.trim();

        if (!reply) {
            alert("Vui lòng nhập phản hồi");
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/reply`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        reply: reply
                    })
                }
            );

            if (!response.ok) {
                alert("Phản hồi thất bại");
                return;
            }

            alert("Đã phản hồi đánh giá");
            loadReviews();

        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối server");
        }
    }
</script>
