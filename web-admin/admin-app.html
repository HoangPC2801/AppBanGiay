<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý app - HoangShoes Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<div id="admin-header"></div>

<div class="container my-5 flex-grow-1">
    <h1 class="mb-4">Quản lý app</h1>

    <div class="card shadow-sm mb-4">
        <div class="card-body d-flex justify-content-between align-items-center">
            <div>
                <h4 class="mb-1">Đánh giá sản phẩm</h4>
                <p class="text-muted mb-0">Quản lý đánh giá sản phẩm từ người dùng Android app.</p>
            </div>

            <button class="btn btn-primary" onclick="loadReviews()">
                Làm mới
            </button>
        </div>
    </div>

    <div class="table-responsive bg-white shadow-sm">
        <table class="table table-bordered table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Sản phẩm</th>
                    <th>Người đánh giá</th>
                    <th>Số sao</th>
                    <th>Nội dung</th>
                    <th>Ngày tạo</th>
                    <th>Hành động</th>
                </tr>
            </thead>

            <tbody id="reviews-body">
                <tr>
                    <td colspan="7" class="text-center">Đang tải dữ liệu...</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<div id="admin-footer"></div>

<script>
    const API_BASE = "http://127.0.0.1:8000";

    function escapeHtml(text) {
        return String(text || "")
            .replaceAll("&", "&amp;")
            .replaceAll("<", "&lt;")
            .replaceAll(">", "&gt;")
            .replaceAll('"', "&quot;")
            .replaceAll("'", "&#039;");
    }

    function formatDate(dateString) {
        if (!dateString) return "N/A";
        const d = new Date(dateString);
        return d.toLocaleDateString("vi-VN") + " " + d.toLocaleTimeString("vi-VN");
    }

    function renderStars(rating) {
        const starCount = Number(rating || 0);
        return "★".repeat(starCount) + "☆".repeat(5 - starCount);
    }

    async function loadReviews() {
        const tbody = document.getElementById("reviews-body");

        tbody.innerHTML = `
            <tr>
                <td colspan="7" class="text-center">Đang tải dữ liệu...</td>
            </tr>
        `;

        try {
            const response = await fetch(`${API_BASE}/products/reviews/admin/all`);

            if (!response.ok) {
                throw new Error("Không tải được danh sách đánh giá");
            }

            const reviews = await response.json();

            if (!Array.isArray(reviews) || reviews.length === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="7" class="text-center text-muted">
                            Chưa có đánh giá nào.
                        </td>
                    </tr>
                `;
                return;
            }

            tbody.innerHTML = "";

            reviews.forEach(review => {
                tbody.innerHTML += `
                    <tr>
                        <td>#${review.id}</td>

                        <td>
                            <div class="fw-bold text-primary">
                                ${escapeHtml(review.product_name || "Không rõ sản phẩm")}
                            </div>
                            <small class="text-muted">Product ID: ${review.product_id}</small>
                        </td>

                        <td>
                            <div class="fw-bold">
                                ${escapeHtml(review.user_name || "Người dùng")}
                            </div>
                            <small class="text-muted">${escapeHtml(review.firebase_uid || "")}</small>
                        </td>

                        <td class="text-warning fw-bold">
                            ${renderStars(review.rating)}
                        </td>

                        <td style="max-width: 360px;">
                            <div class="mb-2">
                                ${escapeHtml(review.comment || "Không có nội dung")}
                            </div>

                            ${
                                review.admin_reply
                                ? `
                                    <div class="alert alert-info py-2 px-3 mb-2">
                                        <strong>Phản hồi HoangShoe:</strong><br>
                                        ${escapeHtml(review.admin_reply)}
                                    </div>
                                `
                                : `
                                    <div class="text-muted small mb-2">
                                        Chưa có phản hồi từ admin
                                    </div>
                                `
                            }

                            <textarea
                                id="reply-${review.id}"
                                class="form-control form-control-sm mb-2"
                                rows="2"
                                placeholder="Nhập phản hồi admin..."
                            >${escapeHtml(review.admin_reply || "")}</textarea>

                            <button
                                class="btn btn-sm btn-primary"
                                onclick="replyReview(${review.id})"
                            >
                                Gửi phản hồi
                            </button>
                        </td>

                        <td>
                            <div>${formatDate(review.created_at)}</div>

                            ${
                                review.is_hidden
                                ? `<span class="badge bg-danger mt-1">Đã ẩn</span>`
                                : `<span class="badge bg-success mt-1">Đang hiển thị</span>`
                            }
                        </td>

                        <td>
                            ${
                                review.is_hidden
                                ? `
                                    <button
                                        class="btn btn-sm btn-success"
                                        onclick="showReview(${review.id})"
                                    >
                                        Hiện
                                    </button>
                                `
                                : `
                                    <button
                                        class="btn btn-sm btn-warning"
                                        onclick="hideReview(${review.id})"
                                    >
                                        Ẩn
                                    </button>
                                `
                            }
                        </td>
                    </tr>
                `;
            });

        } catch (error) {
            console.error(error);
            tbody.innerHTML = `
                <tr>
                    <td colspan="7" class="text-danger text-center">
                        Lỗi kết nối Server!
                    </td>
                </tr>
            `;
        }
    }

    async function hideReview(id) {

        if (!confirm("Ẩn đánh giá này?")) return;

        try {

            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/hide`,
                {
                    method: "PATCH"
                }
            );

            if (!response.ok) {
                alert("Ẩn đánh giá thất bại!");
                return;
            }

            alert("Đã ẩn đánh giá");

            loadReviews();

        } catch (error) {

            console.error(error);

            alert("Lỗi kết nối server");
        }
    }

    async function showReview(id) {

        if (!confirm("Hiện lại đánh giá này?")) return;

        try {

            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/show`,
                {
                    method: "PATCH"
                }
            );

            if (!response.ok) {
                alert("Hiện đánh giá thất bại!");
                return;
            }

            alert("Đã hiện lại đánh giá");

            loadReviews();

        } catch (error) {

            console.error(error);

            alert("Lỗi kết nối server");
        }
    }

    window.onload = () => {
        loadReviews();
    };

    async function replyReview(id) {
        const textarea = document.getElementById(`reply-${id}`);
        const reply = textarea.value.trim();

        if (!reply) {
            alert("Vui lòng nhập phản hồi");
            return;
        }

        try {
            const response = await fetch(
                `${API_BASE}/products/reviews/admin/${id}/reply`,
                {
                    method: "PATCH",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        reply: reply
                    })
                }
            );

            if (!response.ok) {
                alert("Phản hồi thất bại");
                return;
            }

            alert("Đã phản hồi đánh giá");
            loadReviews();

        } catch (error) {
            console.error(error);
            alert("Lỗi kết nối server");
        }
    }
</script>

<script src="layout.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
